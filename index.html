<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMPEG Kehadiran</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C2036">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#14304C; --navy-light:#1F4368; --navy-deep:#0C2036;
    --teal:#0E7C7B; --teal-light:#12A3A0; --teal-pale:#E4F3F2;
    --amber:#E8A33D; --amber-pale:#FBF0DE;
    --red:#C0483E; --red-pale:#F8E7E5;
    --grey:#8A8F98; --grey-pale:#EEF0F3;
    --bg:#F4F6F9; --card:#FFFFFF; --border:#E2E7ED;
    --text:#1B2430; --text-muted:#5B6774;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3,.num{font-family:'Space Grotesk',system-ui,sans-serif;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  #sidebar{width:230px;flex-shrink:0;background:var(--navy-deep);color:#fff;display:flex;flex-direction:column;padding:18px 12px;}
  #sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
  #sidebar .brand .ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--teal-light) var(--pct,70%),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #sidebar .brand .ring::after{content:'';width:24px;height:24px;border-radius:50%;background:var(--navy-deep);}
  #sidebar .brand-text{line-height:1.2;}
  #sidebar .brand-text b{font-family:'Space Grotesk';font-size:15px;display:block;}
  #sidebar .brand-text span{font-size:11px;color:rgba(255,255,255,.55);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.75);font-weight:500;font-size:13.5px;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--teal);color:#fff;}
  .nav-item .ic{width:18px;text-align:center;}
  #sidebar .foot{margin-top:auto;padding:10px 8px;font-size:11px;color:rgba(255,255,255,.4);}

  /* Mobile top nav */
  #mobtabs{display:none;}

  main{flex:1;min-width:0;padding:22px 26px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:20px;margin:0 0 2px;color:var(--navy);}
  .topbar .sub{color:var(--text-muted);font-size:13px;}
  .today-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12.5px;color:var(--navy);font-weight:600;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .grid{display:grid;gap:14px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:1fr 1fr;}
  @media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}.g2{grid-template-columns:1fr;}}

  .stat-card{display:flex;flex-direction:column;gap:6px;}
  .stat-card .top{display:flex;justify-content:space-between;align-items:center;}
  .stat-card .lbl{font-size:12px;color:var(--text-muted);font-weight:600;}
  .stat-card .val{font-size:26px;font-weight:700;color:var(--navy);}
  .stat-card .emoji{font-size:18px;}

  .btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-light);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border);}
  .btn-outline:hover{background:var(--grey-pale);}
  .btn-danger{background:var(--red-pale);color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-light);outline-offset:0;border-color:var(--teal-light);}
  label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:9px 10px;background:var(--grey-pale);color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;position:sticky;top:0;}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:#FAFBFD;}
  .table-wrap{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);}
  .table-wrap table{margin:0;}
  .table-wrap th{top:0;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-hadir{background:var(--teal-pale);color:var(--teal);}
  .badge-warn{background:var(--amber-pale);color:#96691E;}
  .badge-tidak{background:var(--red-pale);color:var(--red);}
  .badge-grey{background:var(--grey-pale);color:var(--grey);}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar input[type=text],.toolbar input[type=search]{min-width:200px;}
  .spacer{flex:1;}

  .section-title{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .muted{color:var(--text-muted);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(12,32,54,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;}
  .modal h3{margin:0 0 16px;color:var(--navy);}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .lbl{width:150px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
  .bar-track{flex:1;background:var(--grey-pale);border-radius:6px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-row .n{width:34px;text-align:right;font-weight:700;font-size:12.5px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.2);}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;}
  }

  /* Visual report (image export) */
  .rv-wrap{overflow-x:auto;padding:10px 0;}
  .report-visual{width:760px;background:#fff;font-family:'Inter',sans-serif;color:#0D4C92;display:flex;flex-direction:column;}
  .rv-header{display:flex;align-items:flex-start;gap:14px;padding:20px 26px 14px;}
  .rv-logo{width:76px;height:76px;object-fit:contain;flex-shrink:0;}
  .rv-logo-placeholder{width:76px;height:76px;border:2px dashed #ccd3dc;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9aa4b1;text-align:center;}
  .rv-header h2{font-family:'Space Grotesk';font-size:16.5px;line-height:1.25;margin:2px 0 0;color:#0D4C92;text-transform:uppercase;flex:1;}
  .rv-badge{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
  .rv-badge-logo{width:76px;height:76px;object-fit:contain;}
  .rv-badge-text{font-family:'Space Grotesk';font-weight:700;font-size:9.5px;color:#0D4C92;text-align:center;max-width:100px;text-transform:uppercase;line-height:1.2;}
  .rv-stripe{height:14px;background:linear-gradient(100deg, #0D4C92 0%, #0D4C92 68%, #FFC93C 68%, #FFC93C 100%);}
  .rv-body{padding:20px 26px 0;flex:1;display:flex;flex-direction:column;}
  .rv-grid{display:grid;grid-template-columns:1.08fr 0.92fr;gap:20px;align-items:stretch;flex:1;}
  .rv-left{display:flex;flex-direction:column;}
  .rv-right{display:flex;flex-direction:column;}
  .rv-title h1{font-family:'Space Grotesk';font-size:31px;line-height:1.08;margin:0;color:#0D4C92;font-weight:700;}
  .rv-title .accent{color:#E0A400;display:block;}
  .rv-datechip{display:inline-flex;align-items:center;gap:8px;background:#0D4C92;color:#fff;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:6px;margin:13px 0 16px;align-self:flex-start;}
  .rv-chartcard{border:1px solid #e2e7ed;border-radius:10px;padding:16px 16px 14px;flex:1;}
  .rv-chartcard h4{font-family:'Space Grotesk';font-size:12px;color:#0D4C92;margin:0 0 11px;text-transform:uppercase;letter-spacing:.02em;}
  .rv-chartcard h4.sub{margin-top:14px;}
  .rv-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .rv-bar-row .l{width:118px;font-size:11px;color:#3d4756;flex-shrink:0;}
  .rv-bar-track{flex:1;background:#EEF0F3;border-radius:5px;height:13px;overflow:hidden;}
  .rv-bar-fill{height:100%;border-radius:5px;}
  .rv-bar-row .v{width:20px;text-align:right;font-weight:700;font-size:11.5px;}
  .rv-photo{width:100%;flex:1;min-height:160px;object-fit:cover;border-radius:10px;border:1px solid #e2e7ed;background:#f4f6f9;}
  .rv-photo-empty{width:100%;flex:1;min-height:160px;border-radius:10px;border:2px dashed #ccd3dc;display:flex;align-items:center;justify-content:center;color:#9aa4b1;font-size:12px;text-align:center;padding:16px;}
  .rv-pctrow{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .rv-pctring{width:58px;height:58px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .rv-pctring .inner{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:11px;color:#0D4C92;}
  .rv-pctlabel{font-family:'Space Grotesk';font-weight:700;font-size:12px;color:#0D4C92;line-height:1.2;}
  .rv-pctlabel .big{font-size:21px;}
  .rv-statlist{margin-top:12px;}
  .rv-stat{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .rv-stat .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .rv-stat .lbl{font-size:11.5px;color:#5B6774;font-weight:600;}
  .rv-stat .val{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:#0D4C92;}
  .rv-footerstripe{height:11px;background:repeating-linear-gradient(45deg,#0D4C92 0 14px,#FFC93C 14px 28px);margin-top:18px;}
  .rv-footer{background:#0D4C92;color:#fff;text-align:center;padding:13px 20px;font-style:italic;font-weight:700;font-size:13.5px;font-family:'Space Grotesk';}

  /* Disiplin Pegawai */
  .daychart{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:10px 4px 4px;}
  .daychart .col{display:flex;flex-direction:column-reverse;width:16px;height:150px;flex-shrink:0;border-radius:3px;overflow:hidden;background:var(--grey-pale);}
  .daychart .col .seg{width:100%;}
  .daychart .col-lbl{font-size:9.5px;color:var(--text-muted);text-align:center;margin-top:4px;width:16px;flex-shrink:0;writing-mode:vertical-rl;}
  .daychart-wrap{display:flex;flex-direction:column;}
  .legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .disiplin-row{cursor:pointer;}
  .disiplin-row:hover td{background:var(--teal-pale);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px;}
  .cal-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
  .cal-cell.empty{background:transparent;}

  /* Jadwal Apel poster */
  .ja-wrap{overflow-x:auto;padding:10px 0;}
  .report-ja{width:680px;background:linear-gradient(160deg,#0B2F73 0%,#123C8C 55%,#0B2F73 100%);color:#fff;font-family:'Inter',sans-serif;padding:32px 30px 26px;box-sizing:border-box;}
  .ja-logo{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 12px;}
  .ja-logo-placeholder{width:80px;height:80px;border:2px dashed rgba(255,255,255,.3);border-radius:8px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.5);}
  .ja-dinas{text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:16px;line-height:1.3;text-transform:uppercase;}
  .ja-kab{text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:14px;color:#F2C230;text-transform:uppercase;margin-top:2px;}
  .ja-megaphone{display:block;text-align:center;font-size:32px;margin:14px 0 2px;}
  .ja-title h1{font-family:'Space Grotesk';font-size:26px;font-weight:700;text-align:center;margin:0;line-height:1.15;text-transform:uppercase;}
  .ja-title .accent{color:#F2C230;display:block;font-size:34px;margin-top:2px;}
  .ja-table{margin-top:18px;}
  .ja-row{display:grid;grid-template-columns:1.2fr 0.8fr;gap:6px;margin-bottom:6px;}
  .ja-row.ja-row3{grid-template-columns:1.15fr 0.75fr 1.1fr;}
  .ja-cell{background:#fff;color:#0F2C6B;border-radius:8px;padding:11px 8px;font-weight:700;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.3;}
  .ja-head .ja-cell{background:#F2C230;font-size:10.5px;text-transform:uppercase;}
  .ja-note{margin-top:14px;border:2px solid #F2C230;border-radius:12px;padding:12px 16px;font-size:11px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;}
  .ja-note .ic{font-size:18px;flex-shrink:0;}
  .ja-footer{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:10.5px;font-weight:700;font-family:'Space Grotesk';}
  .report-ja.has-bg{width:520px;aspect-ratio:1024/1536;background-size:cover;background-position:center;padding:0;position:relative;}
  .ja-bg-content{position:absolute;top:27%;left:9%;right:9%;bottom:25%;display:flex;flex-direction:column;justify-content:center;}
  .report-ja.has-bg .ja-title h1{color:#fff;font-size:22px;}
  .report-ja.has-bg .ja-title .accent{font-size:22px;}
  .report-ja.has-bg .ja-table{margin-top:10px;}
  .report-ja.has-bg .ja-cell{padding:9px 7px;font-size:11px;}
  .report-ja.has-bg .ja-head .ja-cell{font-size:11.5px;}
  .report-ja.has-bg .ja-note{margin-top:10px;padding:9px 12px;font-size:10px;background:rgba(11,47,115,.55);}

  /* Pemberitahuan Kerja Bakti */
  .kb-wrap{overflow-x:auto;padding:10px 0;}
  .report-kb{width:640px;background:#fff;font-family:'Inter',sans-serif;color:#1C5631;padding:24px 26px;box-sizing:border-box;border:1px solid #e2e7ed;}
  .kb-headtop{display:flex;align-items:flex-start;gap:14px;}
  .kb-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
  .kb-logo-placeholder{width:64px;height:64px;border:2px dashed #cddccf;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#8fa895;text-align:center;}
  .kb-titleblock h1{font-family:'Space Grotesk';font-weight:700;font-size:21px;line-height:1.18;margin:0;text-transform:uppercase;color:#1C5631;}
  .kb-titleblock h1 .accent{color:#F2A71B;}
  .kb-subbar{background:#1C5631;color:#fff;text-align:center;font-weight:700;font-size:11.5px;padding:9px 14px;border-radius:8px;margin-top:14px;text-transform:uppercase;line-height:1.4;}
  .kb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .kb-card{border:2px solid #cfe3d2;border-radius:12px;padding:12px 14px;}
  .kb-card h4{display:flex;align-items:center;gap:6px;font-family:'Space Grotesk';font-size:11.5px;color:#1C5631;margin:0 0 8px;text-transform:uppercase;}
  .kb-waktu-day{background:#F2C230;color:#1C5631;font-weight:700;font-size:12px;padding:5px 10px;border-radius:6px;display:inline-block;margin-bottom:6px;}
  .kb-waktu-jam{font-weight:700;font-size:13px;}
  .kb-loklist{margin:0;padding-left:18px;font-size:11px;line-height:1.65;}
  .kb-koordbar{background:#1C5631;color:#fff;font-weight:700;font-size:10px;text-align:center;padding:6px;border-radius:6px;text-transform:uppercase;margin-bottom:6px;}
  .kb-koordname{text-align:center;font-weight:700;font-size:11.5px;margin-bottom:8px;min-height:14px;}
  .kb-asistenbar{background:#F2C230;color:#1C5631;font-weight:700;font-size:10px;text-align:center;padding:6px;border-radius:6px;text-transform:uppercase;margin-bottom:6px;}
  .kb-asistenname{text-align:center;font-weight:700;font-size:11.5px;min-height:14px;}
  .kb-pesertahead{background:#1C5631;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:7px;border-radius:6px;text-transform:uppercase;margin:14px 0 10px;}
  .kb-alatgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;text-align:center;}
  .kb-alatlbl{font-weight:700;font-size:11px;color:#1C5631;margin-bottom:6px;}
  .kb-alatval{background:#F2C230;color:#1C5631;font-weight:700;font-size:12px;padding:6px 12px;border-radius:6px;display:inline-block;}
  .kb-notice{background:#1C5631;color:#fff;border-radius:10px;padding:12px 14px;font-size:10.5px;line-height:1.65;margin-top:16px;}
  .kb-tagline{text-align:center;font-style:italic;font-weight:700;color:#1C5631;font-size:11.5px;margin-top:14px;}

  /* Laporan Kepala Dinas (PDF) */
  .kd-wrap{overflow-x:auto;padding:10px 0;}
  .report-kd{width:780px;background:#fff;color:var(--text);font-family:'Inter',sans-serif;padding:36px 40px;box-sizing:border-box;}
  .kd-head{text-align:center;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:18px;}
  .kd-head img{width:60px;height:60px;object-fit:contain;margin-bottom:8px;}
  .kd-head h1{font-family:'Space Grotesk';font-size:19px;color:var(--navy);margin:2px 0;text-transform:uppercase;}
  .kd-head .sub{font-size:12px;color:var(--text-muted);}
  .kd-section{margin-bottom:22px;}
  .kd-section h3{font-family:'Space Grotesk';font-size:13.5px;color:var(--navy);border-left:4px solid var(--teal);padding-left:8px;margin:0 0 10px;}
  .kd-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .kd-table th{background:var(--navy);color:#fff;padding:7px 8px;text-align:left;font-weight:700;}
  .kd-table td{padding:6px 8px;border-bottom:1px solid var(--border);}
  .kd-table tr:nth-child(even) td{background:#FAFBFD;}
  .kd-note{font-size:11px;color:var(--text-muted);margin-top:6px;}
  .kd-highlight{background:var(--red-pale);color:var(--red);font-weight:700;padding:8px 12px;border-radius:6px;font-size:11.5px;margin-top:8px;}
  .kd-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  /* Surat Teguran */
  .teguran-flag-row{cursor:default;}

<script>
/* ================= CONSTANTS ================= */
const TABS = [
  {id:'dashboard', label:'Dasbor', ic:'&#9679;'},
  {id:'kehadiran', label:'Input Kehadiran', ic:'&#10003;'},

  {id:'laporan', label:'Laporan', ic:'&#128196;'},
  {id:'pengaturan', label:'Pengaturan', ic:'&#9881;'},

const STATUS_HADIR = ['Hadir Apel Pagi','Tugas Belajar','Latsar CPNS','Tugas Luar Daerah','WFA','Terlambat','Izin Terlambat','Cuti'];
const STATUS_TIDAK = ['Sakit','Izin Tidak Masuk','Tanpa Keterangan'];
const STATUS_ALL = [...STATUS_HADIR, ...STATUS_TIDAK];
const STATUS_META = {
  'Hadir Apel Pagi': {emoji:'&#9989;', cat:'hadir', badge:'badge-hadir'},
  'Tugas Belajar':   {emoji:'&#127891;', cat:'hadir', badge:'badge-hadir'},
  'Latsar CPNS':     {emoji:'&#128214;', cat:'hadir', badge:'badge-hadir'},
  'Tugas Luar Daerah':{emoji:'&#127970;', cat:'hadir', badge:'badge-hadir'},
  'WFA':             {emoji:'&#127968;', cat:'hadir', badge:'badge-hadir'},
  'Terlambat':       {emoji:'&#9200;', cat:'hadir', badge:'badge-warn'},
  'Izin Terlambat':  {emoji:'&#9203;', cat:'hadir', badge:'badge-warn'},
  'Cuti':            {emoji:'&#127796;', cat:'hadir', badge:'badge-hadir'},
  'Sakit':           {emoji:'&#129297;', cat:'tidak', badge:'badge-tidak'},
  'Izin Tidak Masuk':{emoji:'&#128221;', cat:'tidak', badge:'badge-tidak'},
  'Tanpa Keterangan':{emoji:'&#10060;', cat:'tidak', badge:'badge-grey'},
};
const STATUS_KEPEG = ['PNS','CPNS','PPPK','PPPK Paruh Waktu','Tenaga Kontrak Daerah'];
const APEL_VIOLATION = ['Terlambat','Izin Terlambat','Izin Tidak Masuk','Tanpa Keterangan'];
function isApelViolation(status){ return APEL_VIOLATION.indexOf(status)>=0; }
const HARI_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

/* ================= STATE ================= */
let EMPLOYEES = [];
let SETTINGS = { namaDinas:'DINAS ...', namaKabupaten:'KABUPATEN ...', kepalaDinas:'', kepalaDinasNip:'', alamatDinas:'', motto:'Bekerja Keras, Bergerak Cepat dan Bertindak Tepat', programBadge:'', logoDataUrl:'', badgeLogoDataUrl:'', adminPassword:'', userPassword:'', deskripsiJumatBersih:'Kegiatan Jumat Bersih dilaksanakan oleh seluruh Pegawai sebagai bentuk komitmen dalam menjaga kebersihan, kenyamanan, dan kesehatan lingkungan kerja.', lokasiJumatBersih1:'', lokasiJumatBersih2:'', geoEnabled:'', officeLat:'', officeLng:'', officeRadius:'150' };
let CURRENT_TAB = 'dashboard';
let ATTENDANCE_CACHE = {};
let BULK_SELECTED = new Set();
let DASHBOARD_DATE = todayStr();
let KEHADIRAN_DATE = todayStr();
let RIWAYAT_DATE = todayStr();
let LAPORAN_DATE = todayStr();
let LAPORAN_PHOTO = ''; // local only, not saved to sheet
let LAPORAN_TYPE = null; // 'kehadiran' | 'jumatbersih' | 'kadis' — set on first render based on day of week
let KADIS_MODE = 'bulanan';
let KADIS_MONTH = todayStr().slice(0,7);
let KADIS_START = todayStr().slice(0,8)+'01';
let KADIS_END = todayStr();
let JB_PHOTO1 = '';
let JB_PHOTO2 = '';
let JB_LOKASI1 = '';
let JB_LOKASI2 = '';
let JB_DESKRIPSI = '';
function isFridayDate(dateStr){ return parseDateStr(dateStr).getDay()===5; }
let DISIPLIN_MODE = 'bulanan'; // 'bulanan' | 'rentang'
let DISIPLIN_MONTH = todayStr().slice(0,7);
let DISIPLIN_START = todayStr().slice(0,8)+'01';
let DISIPLIN_END = todayStr();
let DISIPLIN_LAST_DATES = [];
let DISIPLIN_FILTER = { bidang:'', statusKepeg:'' };
let DISIPLIN_LOADING = false;
let TEGURAN_WEEK = mondayOf(todayStr());
let TEGURAN_THRESHOLD = 3;
let TEGURAN_DATA = null;
let TEGURAN_NOMOR_SURAT = '';
let TEGURAN_TANGGAL_SURAT = todayStr();
let CHECKIN_SEARCH = '';
let CHECKIN_BIDANG = '';
let WAJAH_DB = {};
let FACEAPI_LOADED = false;
let FACEAPI_LOADING_PROMISE = null;
let WAJAH_SEARCH = '';
let WAJAH_SELECTED_EMP = null;
let WAJAH_CAM_STREAM = null;
let FACE_STREAM = null;
let FACE_SCAN_INTERVAL = null;
let FACE_PAUSED = false;
let FACE_KIOSK_ACTIVE = false;
let JADWAL_WEEK = mondayOf(todayStr());
let JADWAL_ROWS = [];
let JADWAL_CATATAN = '15 Menit Sebelum Apel dimulai, Para Kepala Bidang melaporkan dan memastikan kehadiran staf di bidang ke Bagian Sekretariat terlebih dahulu.';
let JADWAL_LOADED_WEEK = null;
let JADWAL_BG_DATAURL = localStorage.getItem('simpeg_jadwal_bg') || '';
let JADWAL_TYPE = 'apel'; // 'apel' | 'kerjabakti'
let KB_JAM = '08:00 - 10:00 WITA';
let KB_LOKASI1 = '';
let KB_LOKASI2 = '';
let KB_KOORD1 = '';
let KB_ASISTEN1 = '';
let KB_KOORD2 = '';
let KB_ASISTEN2 = '';
let KB_PESERTA1 = '';
let KB_PESERTA2 = '';
let KB_ALAT_PEREMPUAN = 'Sapu';
let KB_ALAT_LAKI = 'Sekop';
let KB_CATATAN_DOK = 'Paling lambat pukul 08:10 WITA, Asisten Koordinator Lapangan wajib mengirimkan minimal 3 (tiga) foto dokumentasi kegiatan di lokasi kerja bakti ke grup WhatsApp Dinas. Dokumentasi tersebut akan dihimpun, diedit, dan dilaporkan kepada Bupati dan Wakil Bupati sebagai laporan pelaksanaan kegiatan sekaligus bukti kehadiran pegawai.';
let KB_TAGLINE = 'Mari bersama menjaga kebersihan lingkungan demi lingkungan yang bersih, sehat dan indah!';
let KB_LOADED_WEEK = null;
let KB_BG_DATAURL = localStorage.getItem('simpeg_kb_bg') || '';
function mondayOf(dateStr){
  const d = parseDateStr(dateStr);
  const day = d.getDay();
  const diff = day===0 ? -6 : (1-day);
  d.setDate(d.getDate()+diff);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function addDays(dateStr, n){
  const d = parseDateStr(dateStr);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
let PEGAWAI_SEARCH = '';
let KEHADIRAN_FILTER = { search:'', bidang:'', status:'', statusKepeg:'' };
let LOADING = true;
let AUTH_ROLE = localStorage.getItem('simpeg_role') || null;
let AUTH_BIDANG = localStorage.getItem('simpeg_bidang') || null;
let BIDANG_PASSWORDS = {};
let HOLIDAYS = {}; // { 'YYYY-MM-DD': 'keterangan' }
const USER_ALLOWED_TABS = ['dashboard','kehadiran'];
function visibleTabs(){ return AUTH_ROLE==='user' ? TABS.filter(t=>USER_ALLOWED_TABS.indexOf(t.id)>=0) : TABS; }

/* ================= UTILS ================= */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function formatIndoDate(s){ const dt=parseDateStr(s); return HARI_ID[dt.getDay()]+', '+dt.getDate()+' '+BULAN_ID[dt.getMonth()]+' '+dt.getFullYear(); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'emp_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function showToast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=''; }, 2200);
}
function activeEmployees(){ return EMPLOYEES.filter(e=>e.statusAktif==='Aktif'); }
function uniqueBidang(){ return [...new Set(EMPLOYEES.map(e=>e.bidang).filter(Boolean))].sort(); }

/* ================= STORAGE (Google Sheets via Apps Script Web App, over internet) ================= */
let API_URL = localStorage.getItem('simpeg_api_url') || '';
let CONN_ERROR = false;

async function storageGet(key){
  if(!API_URL) return null;
  try{
    const res = await fetch(API_URL+'?action=get&key='+encodeURIComponent(key));
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.value!==undefined) ? j.value : null;
  }catch(e){ CONN_ERROR = true; return null; }
}
async function storageSet(key, value){
  if(!API_URL) return false;
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value})
    });
    CONN_ERROR = false;
    return true;
  }catch(e){ CONN_ERROR = true; showToast('Gagal menyimpan ke Google Sheets. Periksa koneksi internet.'); return false; }
}
async function storageList(prefix){
  if(!API_URL) return [];
  try{
    const res = await fetch(API_URL+'?action=list&prefix='+encodeURIComponent(prefix));
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.keys) ? j.keys : [];
  }catch(e){ CONN_ERROR = true; return []; }
}
async function testConnection(url){
  try{
    const res = await fetch(url+'?action=list&prefix=__ping__');
    if(!res.ok) return false;
    const j = await res.json();
    return !!(j && j.keys!==undefined);
  }catch(e){ return false; }
}
async function storageGetAll(){
  if(!API_URL) return {};
  try{
    const res = await fetch(API_URL+'?action=getall');
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.data) ? j.data : {};
  }catch(e){ CONN_ERROR = true; return {}; }
}

/* ---- Pegawai (structured sheet, human-editable) ---- */
async function fetchPegawaiList(){
  if(!API_URL) return [];
  try{
    const res = await fetch(API_URL+'?action=getPegawai');
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.data) ? j.data : [];
  }catch(e){ CONN_ERROR = true; return []; }
}
async function upsertPegawaiRemote(employee){
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'savePegawai', employee}) });
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.employee) ? j.employee : null;
  }catch(e){ CONN_ERROR = true; showToast('Gagal menyimpan ke Google Sheets. Periksa koneksi internet.'); return null; }
}
async function deletePegawaiRemote(id){
  try{
    await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'deletePegawai', id}) });
    CONN_ERROR = false;
    return true;
  }catch(e){ CONN_ERROR = true; showToast('Gagal menghapus di Google Sheets.'); return false; }
}
async function importPegawaiBulkRemote(employees){
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'importPegawaiBulk', employees}) });
    const j = await res.json();
    CONN_ERROR = false;
    return (j && j.data) ? j.data : [];
  }catch(e){ CONN_ERROR = true; showToast('Gagal mengimpor ke Google Sheets.'); return []; }
}

async function loadAll(){
  const [emp, set, bidangPass, libur] = await Promise.all([ fetchPegawaiList(), storageGet('pengaturan:info'), storageGet('pengaturan:bidangpass'), storageGet('pengaturan:harilibur') ]);
  EMPLOYEES = emp || [];
  if(set) SETTINGS = Object.assign(SETTINGS, JSON.parse(set));
  BIDANG_PASSWORDS = bidangPass ? JSON.parse(bidangPass) : {};
  HOLIDAYS = libur ? JSON.parse(libur) : {};
  await ensureAttendanceLoaded(todayStr());
  LOADING = false;
}
async function saveSettings(){ await storageSet('pengaturan:info', JSON.stringify(SETTINGS)); }

async function ensureAttendanceLoaded(date){
  if(ATTENDANCE_CACHE[date]) return;
  const raw = await storageGet('kehadiran:'+date);
  ATTENDANCE_CACHE[date] = raw ? JSON.parse(raw) : {};
}
function getAttendance(date, empId){
  const day = ATTENDANCE_CACHE[date] || {};
  return day[empId] || { status:'Tanpa Keterangan', ket:'' };
}
async function setAttendanceOne(date, empId, status, ket){
  await ensureAttendanceLoaded(date);
  const day = ATTENDANCE_CACHE[date];
  const prev = day[empId] || {};
  day[empId] = { status: status!==undefined?status:(prev.status||'Tanpa Keterangan'), ket: ket!==undefined?ket:(prev.ket||''), ts: new Date().toISOString() };
  await storageSet('kehadiran:'+date, JSON.stringify(day));
}
async function setAttendanceBulk(date, empIds, status){
  await ensureAttendanceLoaded(date);
  const day = ATTENDANCE_CACHE[date];
  empIds.forEach(id=>{
    const prev = day[id] || {};
    day[id] = { status, ket: prev.ket||'', ts: new Date().toISOString() };
  });
  await storageSet('kehadiran:'+date, JSON.stringify(day));
}

function dayCounts(date){
  const list = activeEmployees();
  const counts = {}; STATUS_ALL.forEach(s=>counts[s]=0);
  list.forEach(e=>{ const a = getAttendance(date, e.id); counts[a.status] = (counts[a.status]||0)+1; });
  const hadir = STATUS_HADIR.reduce((s,k)=>s+counts[k],0);
  const tidak = STATUS_TIDAK.reduce((s,k)=>s+counts[k],0);
  return { counts, hadir, tidak, total:list.length };
}

/* ================= INIT / NAV ================= */
async function init(){
  if(!API_URL){ renderConnectGate(); return; }
  renderShell();
  document.getElementById('tab-content').innerHTML = '<div class="empty-state">Menghubungkan ke Google Sheets...</div>';
  await loadAll();
  if(location.hash==='#checkin'){ await renderCheckinKiosk(); return; }
  if(location.hash==='#facecheckin'){ await renderFaceCheckinKiosk(); return; }
  if(needsLogin()){ renderLoginGate(); return; }
  if(AUTH_ROLE==='bidang'){ await renderBidangAdminView(); return; }
  if(AUTH_ROLE==='user' && USER_ALLOWED_TABS.indexOf(CURRENT_TAB)<0) CURRENT_TAB = 'dashboard';
  renderShell();
  renderTab();
}
function needsLogin(){
  const anyBidangPass = Object.values(BIDANG_PASSWORDS).some(p=>p);
  if(!(SETTINGS.adminPassword || SETTINGS.userPassword || anyBidangPass)) return false;
  return !AUTH_ROLE;
}
function toggleLoginBidangField(){
  const role = document.getElementById('login-role').value;
  const wrap = document.getElementById('login-bidang-wrap');

function distanceMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function checkGeofence(){
  if(SETTINGS.geoEnabled!=='true' || !SETTINGS.officeLat || !SETTINGS.officeLng){
    return Promise.resolve({ ok:true });
  }
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve({ ok:false, reason:'Perangkat/browser ini tidak mendukung layanan lokasi.' }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, parseFloat(SETTINGS.officeLat), parseFloat(SETTINGS.officeLng));
        const radius = parseFloat(SETTINGS.officeRadius)||150;
        if(dist <= radius) resolve({ ok:true, dist });
        else resolve({ ok:false, reason:'Anda berada di luar radius lokasi kantor (jarak sekitar '+Math.round(dist)+' m dari titik yang ditentukan).', dist });
      },
      ()=>{ resolve({ ok:false, reason:'Gagal mengambil lokasi. Pastikan izin lokasi (GPS) diaktifkan untuk browser ini, lalu coba lagi.' }); },
      { enableHighAccuracy:true, timeout:12000 }
    );
  });
}

}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Gagal memuat '+src));
    document.head.appendChild(s);
  });
}
async function ensureFaceApiLoaded(setStatus){
  if(FACEAPI_LOADED) return;
  if(FACEAPI_LOADING_PROMISE) return FACEAPI_LOADING_PROMISE;
  FACEAPI_LOADING_PROMISE = (async()=>{
    if(setStatus) setStatus('Memuat modul pengenalan wajah...');
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js');
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
    if(setStatus) setStatus('Memuat model wajah...');
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
    FACEAPI_LOADED = true;
  })();
  return FACEAPI_LOADING_PROMISE;
}
async function loadWajahDb(){

  });
}

async function scanFaceKioskFrame(){
  if(FACE_PAUSED || !FACE_KIOSK_ACTIVE) return;
  const video = document.getElementById('face-kiosk-video');
  if(!video || video.readyState<2) return;
  try{
    const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    if(!det) return;
    let bestId=null, bestDist=999;
    Object.keys(WAJAH_DB).forEach(empId=>{
      const dist = faceapi.euclideanDistance(det.descriptor, WAJAH_DB[empId]);
      if(dist < bestDist){ bestDist = dist; bestId = empId; }
    });
    const THRESHOLD = 0.55;
    if(bestId && bestDist < THRESHOLD){
      const emp = EMPLOYEES.find(e=>e.id===bestId);
      if(emp) autoFaceCheckin(emp, video);
    } else {
      showFaceNotRecognized(video);
    }
  }catch(e){ /* abaikan error deteksi sesaat */ }
}
async function autoFaceCheckin(emp, video){
  FACE_PAUSED = true;
  const canvas = document.getElementById('face-kiosk-canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;

  const el = document.getElementById('face-kiosk-confirm');
  const status = getAttendance(todayStr(), emp.id).status;
  if(status !== 'Tanpa Keterangan'){
    el.innerHTML = `<div class="card face-confirm-card">

    </div>`;
    setTimeout(()=>{ el.innerHTML=''; FACE_PAUSED=false; }, 2500);
    return;
  }
  await setAttendanceOne(todayStr(), emp.id, 'Hadir Apel Pagi', undefined);
  el.innerHTML = `<div class="card face-confirm-card" style="border:2px solid var(--teal);">
    <img src="${thumb}">

}

async function renderMonthRecap(){
  const ym = DASHBOARD_DATE.slice(0,7);
  const keys = await storageList('kehadiran:'+ym);
  const dates = keys.map(k=>k.replace('kehadiran:','')).sort();
  const totalAktif = activeEmployees().length;
  const rows = [];
  for(const d of dates){
    await ensureAttendanceLoaded(d);
    const { hadir, total } = dayCounts(d);
    rows.push({ d, hadir, tidak: (total||totalAktif) - hadir, pct: total? Math.round(hadir/total*100):0 });
  }
  const el = document.getElementById('month-recap');
  if(!el) return;
  const avg = rows.length ? Math.round(rows.reduce((s,r)=>s+r.pct,0)/rows.length) : 0;
  el.innerHTML = `
    <div class="section-title">Rekap Bulanan &mdash; ${BULAN_ID[parseInt(ym.slice(5,7))-1]} ${ym.slice(0,4)} <span class="muted" style="font-weight:400;font-size:12px;">(rata-rata kehadiran ${avg}%)</span></div>
    ${rows.length===0 ? '<div class="muted">Belum ada data kehadiran yang diisi pada bulan ini.</div>' :
    `<div class="table-wrap" style="max-height:260px;"><table><thead><tr><th>Tanggal</th><th>Hadir</th><th>Tidak Hadir</th><th>% Kehadiran</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${formatIndoDate(r.d)}</td><td style="color:var(--teal);font-weight:700;">${r.hadir}</td><td style="color:var(--red);font-weight:700;">${r.tidak}</td><td>${r.pct}%</td></tr>`).join('')}
    </tbody></table></div>`}
  `;
}

function changeKehadiranDate(v){ KEHADIRAN_DATE=v; BULK_SELECTED=new Set(); renderKehadiranTab(); }

function filteredKehadiranList(){
  const f = KEHADIRAN_FILTER;
  return activeEmployees().filter(e=>{
    if(f.search){
      const s = f.search.toLowerCase();
      if(!e.nama.toLowerCase().includes(s) && !(e.nip||'').includes(s)) return false;
    }
    if(f.bidang && e.bidang!==f.bidang) return false;
    if(f.statusKepeg && e.statusKepegawaian!==f.statusKepeg) return false;
    if(f.status){
      const st = getAttendance(KEHADIRAN_DATE, e.id).status;
      if(f.status==='__belum'){ if(st!=='Tanpa Keterangan') return false; }
      else if(st!==f.status) return false;
    }
    return true;
  });
}

function toggleOne(id, checked){ if(checked) BULK_SELECTED.add(id); else BULK_SELECTED.delete(id); renderKehadiranWrap(); }

async function applyBulkStatus(){

async function doImport(){
  const text = document.getElementById('import-text').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length===0){ showToast('Tidak ada data untuk diimpor'); return; }
  const toAdd = [];
  lines.forEach(line=>{
    const cols = line.split('\t').length>1 ? line.split('\t') : line.split(';');
    const [nip, nama, pangkat, jabatan, bidang, statusKepegawaian] = cols.map(c=>(c||'').trim());
    if(!nama) return;
    toAdd.push({
      nip: nip||'', nama, pangkat: pangkat||'', jabatan: jabatan||'', bidang: bidang||'',
      statusKepegawaian: STATUS_KEPEG.includes(statusKepegawaian) ? statusKepegawaian : 'PNS',
      statusAktif: 'Aktif',
    });
  });
  if(toAdd.length===0){ showToast('Tidak ada baris valid untuk diimpor'); return; }
  showToast('Mengimpor '+toAdd.length+' pegawai ke Spreadsheet...');
  const saved = await importPegawaiBulkRemote(toAdd);
  EMPLOYEES = EMPLOYEES.concat(saved);
  closeModal();
  renderShell();
  renderPegawaiTab();
  showToast(saved.length+' pegawai berhasil diimpor');
}
function exportCsv(){
  const header = ['NIP','Nama','Pangkat/Gol','Jabatan','Bidang','Status Kepegawaian','Status Aktif'];
  const rows = EMPLOYEES.map(e=>[e.nip,e.nama,e.pangkat,e.jabatan,e.bidang,e.statusKepegawaian,e.statusAktif]);
  const csv = [header, ...rows].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data-pegawai.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= DISIPLIN PEGAWAI ================= */
function isWeekday(dateStr){ const d = parseDateStr(dateStr).getDay(); return d!==0 && d!==6; }
function isLiburNasional(dateStr){ return !!HOLIDAYS[dateStr]; }
function isHariKerja(dateStr){ return isWeekday(dateStr) && !isLiburNasional(dateStr); }
async function loadMonthDates(month){
  const keys = await storageList('kehadiran:'+month);
  const dates = keys.map(k=>k.replace('kehadiran:','')).filter(isHariKerja).sort();
  for(const d of dates){ await ensureAttendanceLoaded(d); }
  return dates;
}
async function loadDatesInRange(startDate, endDate){
  const keys = await storageList('kehadiran:');
  const dates = keys.map(k=>k.replace('kehadiran:','')).filter(d=> d>=startDate && d<=endDate).filter(isHariKerja).sort();
  for(const d of dates){ await ensureAttendanceLoaded(d); }
  return dates;
}
function computeDisiplinData(dates){
  const employees = activeEmployees().filter(e=>{
    if(DISIPLIN_FILTER.bidang && e.bidang!==DISIPLIN_FILTER.bidang) return false;
    if(DISIPLIN_FILTER.statusKepeg && e.statusKepegawaian!==DISIPLIN_FILTER.statusKepeg) return false;
    return true;
  });
  const perEmployee = employees.map(e=>{
    const counts = {}; STATUS_ALL.forEach(s=>counts[s]=0);
    dates.forEach(d=>{ const st = getAttendance(d, e.id).status; counts[st] = (counts[st]||0)+1; });
    const totalViolation = APEL_VIOLATION.reduce((s,k)=>s+counts[k],0);
    const totalHadirApel = counts['Hadir Apel Pagi']||0;
    const pctDisiplin = dates.length ? Math.round(((dates.length-totalViolation)/dates.length)*100) : 100;
    return { emp:e, counts, totalViolation, totalHadirApel, pctDisiplin };
  });
  perEmployee.sort((a,b)=> b.totalViolation - a.totalViolation);

  const dailyAgg = dates.map(d=>{
    let hadirApel=0, violation=0, lain=0;
    employees.forEach(e=>{
      const st = getAttendance(d,e.id).status;
      if(st==='Hadir Apel Pagi') hadirApel++;
      else if(isApelViolation(st)) violation++;
      else lain++;
    });
    return { date:d, hadirApel, violation, lain };
  });

  const violationBreakdown = {};
  APEL_VIOLATION.forEach(s=>{ violationBreakdown[s] = perEmployee.reduce((sum,p)=>sum+p.counts[s],0); });

  function groupBy(keyFn){
    const g = {};
    perEmployee.forEach(p=>{
      const key = keyFn(p.emp) || '-';
      if(!g[key]) g[key] = { label:key, totalViolation:0, count:0 };
      g[key].totalViolation += p.totalViolation;
      g[key].count += 1;
    });
    return Object.values(g).map(x=>({...x, avg: x.count ? +(x.totalViolation/x.count).toFixed(1) : 0 })).sort((a,b)=>b.avg-a.avg);
  }
  const bidangStats = groupBy(e=>e.bidang);
  const kepegStats = groupBy(e=>e.statusKepegawaian);

  return { employees, perEmployee, dailyAgg, violationBreakdown, bidangStats, kepegStats, totalHari: dates.length };
}

async function downloadTeguranPdf(empId){
  const node = document.getElementById('teguran-capture');
  if(!node){ showToast('Surat belum siap'); return; }
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ showToast('Gagal memuat modul PDF. Periksa koneksi internet lalu coba lagi.'); return; }
  showToast('Menyiapkan PDF...');
  try{
    const canvas = await html2canvas(node, { scale: 2, backgroundColor:'#ffffff', useCORS:true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const item = TEGURAN_DATA.flagged.find(f=>f.emp.id===empId);
    const namaFile = item ? item.emp.nama.replace(/[^a-zA-Z0-9]+/g,'-') : 'pegawai';
    pdf.save('Surat-Teguran-'+namaFile+'.pdf');
  }catch(e){
    console.error(e);
    showToast('Gagal membuat PDF surat.');
  }
}

function defaultJadwalRows(weekStart){
  const bidangList = uniqueBidang();
  const rows = [];
  for(let i=0;i<5;i++){
    const date = addDays(weekStart, i);
    const isFri = i===4;
    const petugas = isFri ? 'Kerja Bakti' : (bidangList[i] || ('Bidang '+(i+1)));
    rows.push({ date, jam: isFri ? '08:00 WITA' : '07:30 WITA', petugas });
  }
  return rows;
}
async function loadJadwalWeek(weekStart){
  const raw = await storageGet('jadwalapel:'+weekStart);
  if(raw){
    const data = JSON.parse(raw);
    JADWAL_ROWS = data.rows || [];
    JADWAL_CATATAN = data.catatan || JADWAL_CATATAN;
  } else {
    JADWAL_ROWS = defaultJadwalRows(weekStart);
  }
  JADWAL_LOADED_WEEK = weekStart;
}

function renderVisualReport(){

  if(!el) return;
  const date = LAPORAN_DATE;
  const { counts, hadir, tidak, total } = dayCounts(date);
  const pct = total ? Math.round((hadir/total)*100) : 0;
  const maxCount = Math.max(1, ...STATUS_ALL.map(s=>counts[s]));
  const barRow = (s)=>{
    const meta = STATUS_META[s];
    const color = meta.cat==='hadir' ? (s==='Terlambat'||s==='Izin Terlambat' ? '#E0A400' : '#0E7C7B') : (s==='Tanpa Keterangan' ? '#8A8F98' : '#C0483E');
    const w = Math.round((counts[s]/maxCount)*100);
    return `<div class="rv-bar-row"><div class="l">${meta.emoji} ${s}</div><div class="rv-bar-track"><div class="rv-bar-fill" style="width:${w}%;background:${color};"></div></div><div class="v">${counts[s]}</div></div>`;
  };
  el.innerHTML = `
    <div class="report-visual" id="rv-capture">

async function downloadVisualReport(captureId, filename){
  captureId = captureId || 'rv-capture';
  filename = filename || ('Laporan-Kehadiran-'+LAPORAN_DATE+'.png');
  const node = document.getElementById(captureId);
  if(!node){ showToast('Laporan belum siap'); return; }
  if(typeof html2canvas === 'undefined'){ showToast('Gagal memuat modul gambar. Periksa koneksi internet lalu coba lagi.'); return; }
  showToast('Menyiapkan gambar...');
  try{
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }catch(e){
    console.error(e);
    showToast('Gagal membuat gambar laporan.');
  }
}
function buildReportText(date){
  const list = activeEmployees();
  const { counts, hadir, tidak, total } = dayCounts(date);
  let out = '';
  out += 'LAPORAN KEHADIRAN PEGAWAI\n';
  out += SETTINGS.namaDinas + '\n';
  if(SETTINGS.namaKabupaten) out += SETTINGS.namaKabupaten + '\n';
  out += formatIndoDate(date) + '\n\n';
  out += 'Total Pegawai : '+total+' Orang\n';
  out += 'Hadir         : '+hadir+' Orang\n';
  out += 'Tidak Hadir   : '+tidak+' Orang\n\n';
  out += 'RINCIAN STATUS\n';
  STATUS_ALL.forEach(s=>{
    const names = list.filter(e=>getAttendance(date,e.id).status===s);
    if(names.length===0) return;
    out += '\n'+s.toUpperCase()+' ('+names.length+')\n';
    names.forEach((e,i)=>{
      const a = getAttendance(date, e.id);
      out += (i+1)+'. '+e.nama + (a.ket ? ' - '+a.ket : '') + '\n';
    });
  });
  if(SETTINGS.kepalaDinas){
    out += '\n\nMengetahui,\nKepala Dinas\n\n\n\n'+SETTINGS.kepalaDinas;
  }
  return out;
}

function computeKadisReportData(dates){
  const employees = activeEmployees();
  const perEmployee = employees.map(e=>{
    const counts = {}; STATUS_ALL.forEach(s=>counts[s]=0);
    dates.forEach(d=>{ const st = getAttendance(d, e.id).status; counts[st] = (counts[st]||0)+1; });
    const totalViolation = APEL_VIOLATION.reduce((s,k)=>s+counts[k],0);
    return { emp:e, counts, totalViolation };
  });

  function groupBy(keyFn){
    const g = {};
    perEmployee.forEach(p=>{
      const key = keyFn(p.emp) || '-';
      if(!g[key]) g[key] = { label:key, hadirApel:0, violation:0, count:0 };
      g[key].count += 1;
      g[key].hadirApel += p.counts['Hadir Apel Pagi'];
      g[key].violation += p.totalViolation;
    });
    return Object.values(g).map(x=>({
      label:x.label, count:x.count, hadirApel:x.hadirApel, violation:x.violation,
      avgViolation: x.count ? +(x.violation/x.count).toFixed(1) : 0,
      pctHadir: (x.count*dates.length) ? Math.round((x.hadirApel/(x.count*dates.length))*100) : 0
    }));
  }
  const bidangStats = groupBy(e=>e.bidang).sort((a,b)=> dates.length===1 ? (b.violation-a.violation) : (b.avgViolation-a.avgViolation));
  const kepegStats = groupBy(e=>e.statusKepegawaian).sort((a,b)=> dates.length===1 ? (b.violation-a.violation) : (b.avgViolation-a.avgViolation));

  const kategoriList = {};
  ['Terlambat','Sakit','Cuti','Izin Tidak Masuk','Tanpa Keterangan'].forEach(cat=>{
    const flat = perEmployee.filter(p=>p.counts[cat]>0)
      .map(p=>({ nama:p.emp.nama, bidang:p.emp.bidang||'-', jumlah:p.counts[cat] }));
    const grouped = {};
    flat.forEach(item=>{
      if(!grouped[item.bidang]) grouped[item.bidang] = [];
      grouped[item.bidang].push(item);
    });
    Object.keys(grouped).forEach(b=> grouped[b].sort((a,b2)=>b2.jumlah-a.jumlah));
    kategoriList[cat] = Object.keys(grouped).sort().map(b=>({ bidang:b, items:grouped[b] }));
  });

  const totalHadirApelAll = perEmployee.reduce((s,p)=>s+p.counts['Hadir Apel Pagi'],0);
  const totalPossible = employees.length*dates.length;
  const pctKehadiranKeseluruhan = totalPossible ? Math.round((totalHadirApelAll/totalPossible)*100) : 0;

  return { employees, perEmployee, bidangStats, kepegStats, kategoriList, totalHari: dates.length, pctKehadiranKeseluruhan };
}

async function downloadKadisPdf(){
  const node = document.getElementById('kd-capture');
  if(!node){ showToast('Laporan belum siap'); return; }
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ showToast('Gagal memuat modul PDF. Periksa koneksi internet lalu coba lagi.'); return; }
  showToast('Menyiapkan PDF...');
  try{
    const canvas = await html2canvas(node, { scale: 2, backgroundColor:'#ffffff', useCORS:true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const periodLabel = KADIS_MODE==='bulanan' ? KADIS_MONTH : (KADIS_START+'_sd_'+KADIS_END);
    pdf.save('Laporan-Kadis-'+periodLabel+'.pdf');
  }catch(e){
    console.error(e);
    showToast('Gagal membuat PDF laporan.');
  }
}

        <label><input type="checkbox" id="s-geo-enabled" ${SETTINGS.geoEnabled==='true'?'checked':''}> Aktifkan batasan lokasi</label>
      </div>
      <div class="toolbar" style="margin-bottom:10px;">
        <button class="btn btn-outline btn-sm" onclick="useCurrentLocationAsOffice()">&#128205; Gunakan Lokasi Saya Sekarang (berdiri di kantor)</button>
      </div>
      <div class="grid g2">
        <div class="field"><label>Latitude Kantor</label><input id="s-geo-lat" type="text" value="${escapeHtml(SETTINGS.officeLat)}" placeholder="-9.5362"></div>
        <div class="field"><label>Longitude Kantor</label><input id="s-geo-lng" type="text" value="${escapeHtml(SETTINGS.officeLng)}" placeholder="124.9191"></div>
      </div>
      <div class="field"><label>Radius Diizinkan (meter)</label><input id="s-geo-radius" type="number" min="20" value="${escapeHtml(SETTINGS.officeRadius||'150')}" style="width:120px;"></div>
      <button class="btn btn-primary" onclick="saveGeoSettings()">Simpan Batasan Lokasi</button>
    </div>
    <div class="card" style="max-width:520px;margin-top:16px;">
      <div class="section-title">&#128279; Koneksi Google Sheets</div>
      <p class="muted">Status: <b style="color:${CONN_ERROR?'var(--red)':'var(--teal)'};">${CONN_ERROR?'Bermasalah':'Tersambung'}</b></p>
      <div class="field"><label>URL Web App</label><input id="s-apiurl" type="text" style="width:100%;" value="${escapeHtml(API_URL)}"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="reconnectApi()">Simpan &amp; Sambungkan Ulang</button>
        <button class="btn btn-outline" onclick="disconnectApi()">Putuskan Koneksi</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px;">Gunakan URL Web App yang sama di setiap HP/perangkat yang dipakai untuk mengisi kehadiran, supaya semua mengakses data yang sama di Spreadsheet.</p>
    </div>
    <div class="card" style="max-width:520px;margin-top:16px;">
      <div class="section-title" style="color:var(--red);">Zona Berbahaya</div>
      <p class="muted">Menghapus seluruh data pegawai dari Spreadsheet. Tindakan ini tidak dapat dibatalkan.</p>
      <button class="btn btn-danger" onclick="resetAllData()">Hapus Semua Data Pegawai</button>
    </div>
  `;
}
async function reconnectApi(){
  const url = document.getElementById('s-apiurl').value.trim();
  if(!url){ showToast('URL tidak boleh kosong'); return; }
  showToast('Menguji koneksi...');
  const ok = await testConnection(url);
  if(!ok){ showToast('Gagal terhubung. Periksa URL dan pengaturan deployment.'); return; }
  API_URL = url;
  localStorage.setItem('simpeg_api_url', url);
  showToast('Tersambung ulang ke Google Sheets');
  init();
}
function disconnectApi(){
  if(!confirm('Putuskan koneksi dari Google Sheets ini? Data di Spreadsheet tidak akan terhapus.')) return;
  localStorage.removeItem('simpeg_api_url');
  API_URL = '';
  EMPLOYEES = [];
  ATTENDANCE_CACHE = {};
  renderConnectGate();
}
async function saveBidangPasswords(){
  const inputs = document.querySelectorAll('.bidang-pass-input');
  const map = {};
  inputs.forEach(inp=>{
    const b = inp.dataset.bidang;
    const v = inp.value.trim();
    if(v) map[b] = v;
  });
  BIDANG_PASSWORDS = map;
  await storageSet('pengaturan:bidangpass', JSON.stringify(map));
  showToast('Kata sandi admin bidang disimpan');
}
function useCurrentLocationAsOffice(){
  if(!navigator.geolocation){ showToast('Perangkat/browser ini tidak mendukung layanan lokasi.'); return; }
  showToast('Mengambil lokasi Anda saat ini...');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      document.getElementById('s-geo-lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('s-geo-lng').value = pos.coords.longitude.toFixed(6);
      showToast('Lokasi terisi. Jangan lupa klik Simpan.');
    },
    ()=>{ showToast('Gagal mengambil lokasi. Pastikan izin lokasi diaktifkan.'); },
    { enableHighAccuracy:true, timeout:12000 }
  );
}
async function saveGeoSettings(){
  SETTINGS.geoEnabled = document.getElementById('s-geo-enabled').checked ? 'true' : '';
  SETTINGS.officeLat = document.getElementById('s-geo-lat').value.trim();
  SETTINGS.officeLng = document.getElementById('s-geo-lng').value.trim();
  SETTINGS.officeRadius = document.getElementById('s-geo-radius').value.trim() || '150';
  if(SETTINGS.geoEnabled==='true' && (!SETTINGS.officeLat || !SETTINGS.officeLng)){
    showToast('Isi dulu Latitude & Longitude kantor sebelum mengaktifkan.');
    return;
  }
  await saveSettings();
  showToast('Batasan lokasi disimpan');
}
async function addHoliday(){
  const dateEl = document.getElementById('libur-date');
  const ketEl = document.getElementById('libur-ket');
  const d = dateEl.value;
  const k = ketEl.value.trim();
  if(!d){ showToast('Pilih tanggal terlebih dahulu'); return; }
  HOLIDAYS[d] = k || 'Libur';
  await storageSet('pengaturan:harilibur', JSON.stringify(HOLIDAYS));
  showToast('Hari libur ditambahkan');
  renderPengaturanTab();
}
async function removeHoliday(dateStr){
  delete HOLIDAYS[dateStr];
  await storageSet('pengaturan:harilibur', JSON.stringify(HOLIDAYS));
  renderPengaturanTab();
}
async function savePengaturan(){
  SETTINGS.namaDinas = document.getElementById('s-dinas').value.trim() || 'DINAS ...';
  SETTINGS.namaKabupaten = document.getElementById('s-kab').value.trim();
  SETTINGS.kepalaDinas = document.getElementById('s-kadis').value.trim();
  SETTINGS.kepalaDinasNip = document.getElementById('s-kadisnip').value.trim();
  SETTINGS.alamatDinas = document.getElementById('s-alamat').value.trim();
  SETTINGS.motto = document.getElementById('s-motto').value.trim();
  SETTINGS.programBadge = document.getElementById('s-badge').value.trim();
  SETTINGS.lokasiJumatBersih1 = document.getElementById('s-jblokasi1').value.trim();
  SETTINGS.lokasiJumatBersih2 = document.getElementById('s-jblokasi2').value.trim();
  SETTINGS.deskripsiJumatBersih = document.getElementById('s-jbdeskripsi').value.trim();
  SETTINGS.adminPassword = document.getElementById('s-adminpass').value.trim();
  SETTINGS.userPassword = document.getElementById('s-userpass').value.trim();
  await saveSettings();
  renderShell();
  showToast('Pengaturan disimpan');
}
function onLogoUpload(file){
  if(!file) return;
  resizeImageToDataUrl(file, 160, function(dataUrl){
    SETTINGS.logoDataUrl = dataUrl;
    renderPengaturanTab();
    showToast('Logo siap — klik "Simpan Pengaturan" untuk menyimpan');
  });
}
function onBadgeLogoUpload(file){
  if(!file) return;
  resizeImageToDataUrl(file, 140, function(dataUrl){
    SETTINGS.badgeLogoDataUrl = dataUrl;
    renderPengaturanTab();
    showToast('Logo badge siap — klik "Simpan Pengaturan" untuk menyimpan');
  });
}
function resizeImageToDataUrl(file, maxDim, cb, format, quality){
  format = format || 'image/png';
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if(format==='image/jpeg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL(format, quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
async function resetAllData(){
  if(!confirm('Yakin ingin menghapus SEMUA data pegawai dari Spreadsheet? Tindakan ini tidak dapat dibatalkan.')) return;
  if(!confirm('Konfirmasi sekali lagi: hapus semua data pegawai sekarang?')) return;
  showToast('Menghapus semua data pegawai...');
  for(const e of EMPLOYEES){ await deletePegawaiRemote(e.id); }
  EMPLOYEES = [];
  renderShell();
  renderTab();
}

/* ================= START ================= */
init();
</script>
</body>
</html>
